<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#130C11" />
    <meta
      name="description"
      content="Warden keeps your IDs, contracts and records encrypted with a key only your password or recovery key can unlock. The database stores ciphertext, never your files."
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/warden_logo_badge.svg" />

    <!-- Open Graph / link previews. Per-route titles and descriptions are
         set at runtime (src/utils/usePageMeta.js); these are the defaults a
         crawler that doesn't run JavaScript sees. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Warden" />
    <meta property="og:title" content="Warden - an encrypted vault for your important documents" />
    <meta
      property="og:description"
      content="Your documents are stored encrypted with a key only you can unlock. A student capstone project from PHINMA University of Pangasinan."
    />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Hero headline weight, preloaded so the landing page's largest text
         renders in its real font without a late swap (see the @font-face
         block in src/styles/global.css). -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- PWA install: manifest.json's icons list PNGs first because
         installability/"Add to Home Screen" icon support for SVG is
         inconsistent - notably iOS Safari doesn't read the manifest's
         icons at all for its home-screen icon, only apple-touch-icon
         below, and older Chromium/Android install flows have been known
         to reject SVG-only icon lists. The SVG is still listed last in
         the manifest for browsers that do support it at any size. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Warden" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Warden - Encrypted document vault</title>

    <!-- Blocking (not type="module", not deferred) so this runs before
         anything paints - src/utils/theme.js's getInitialTheme() mirrors
         this exact same logic and reads the attribute this sets back,
         rather than re-deciding, so the two can never disagree. Doing
         this here instead of in React avoids a flash of the wrong theme
         between first paint and React's first render. -->
    <script>
      (function () {
        // Hardcoded here (and again in applyTheme, src/utils/theme.js)
        // rather than read from a CSS variable, since a <meta> tag's
        // content attribute can't reference one - kept equal to
        // --color-bg/--color-bg (light) in tokens.css by hand. This is
        // the mobile browser-chrome tint color, not page content, so it
        // was easy to miss when the dark palette first shipped.
        var THEME_COLORS = { dark: '#130C11', light: '#F6F2F4' };
        try {
          var stored = localStorage.getItem('warden-theme');
          var theme =
            stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', THEME_COLORS[theme]);
        } catch (e) {
          // localStorage can throw in some privacy modes - the app still
          // renders with its default (dark) theme in that case.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
